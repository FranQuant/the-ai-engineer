# config.yaml — Non-executable configuration contract mirroring config.py + incident_schemas.py
#
# THIS FILE IS DOCUMENTATION ONLY. IT IS NOT LOADED BY ANY RUNTIME PATH.
# config.py is the sole runtime source of truth; incident_schemas.py supplies
# tool registry metadata used at runtime. Update config.py for behavior changes.
#
# Purpose: human-readable reference for operators, CI pipelines, and future ports
# of this agent to environments that prefer YAML-driven configuration.

# ---------------------------------------------------------------------------
# Environment toggles
# ---------------------------------------------------------------------------
env:
  colab_tunnel: false          # Not a runtime toggle. The Colab path is documented in the README, not exercised here.

# ---------------------------------------------------------------------------
# MCP server connection
# ---------------------------------------------------------------------------
mcp:
  protocol_version: "2024-11-05"
  subprotocol: mcp
  server:
    host: "127.0.0.1"
    port: 8765
    uri: "ws://127.0.0.1:8765/mcp"
    name: week04-agentic-incident-command
    version: "1.0.0"
  client:
    name: week04-agentic-incident-client
    version: "1.0.0"

# ---------------------------------------------------------------------------
# OPAL loop budget + guardrails
# ---------------------------------------------------------------------------
budget:
  tokens: 2000          # Per-loop agent budget, debited by each tool's cost_hint_tokens; loop escalates at 0
  ms: 150               # Per-loop budget, debited by the latency each tool reports (fixture values, not measured); escalates at 0
  dollars: 0.0          # NOT TRACKED: no paid model or tool exists, cost_dollars is always 0.0 and nothing enforces it
  max_steps: 5          # Hard step-count ceiling per OPAL loop
  max_failures: 2       # Stop after two failed tool results; failed calls are not retried
  max_loops: 3          # Backstop: loops per incident before escalated/max_loops_reached (loop_guardrail). The planner normally escalates earlier.
  # Trace events carry budget_owner: "agent" (per-loop, also reported by client events) or
  # "server" (server session budget: same token costs, measured wall time).

# ---------------------------------------------------------------------------
# Artifact paths (relative to 02_incident_command_agent/)
# ---------------------------------------------------------------------------
artifacts:
  telemetry_sink: "../artifacts/telemetry.jsonl"   # JSONL append-only telemetry
  memory_snapshot: "../artifacts/memory_snapshot.json"   # written by demo_remote.py next to the trace

# ---------------------------------------------------------------------------
# Tool registry
#
# Each entry mirrors _TOOL_META + get_tool_schemas() in incident_schemas.py.
# Fields:
#   description      — human-readable purpose
#   latency_hint_ms  — expected round-trip latency (stub implementation)
#   cost_hint_tokens — descriptive token-estimation metadata, not the exact runtime debit
#   required         — required input parameter names (from JSON schema)
#   optional         — optional input parameter names (from JSON schema)
# ---------------------------------------------------------------------------
tools:
  - name: retrieve_runbook
    description: >
      Search runbooks by keyword and return the top-k most relevant snippets.
      Used during Observe or Act to surface applicable remediation procedures.
    latency_hint_ms: 5
    cost_hint_tokens: 10    # the server debits exactly this per call
    required: [query]
    optional: [top_k]       # integer 1–5, default 3

  - name: run_diagnostic
    description: >
      Return deterministic fixture output (stdout, stderr, verdict) for a
      diagnostic command on the specified host. No command is executed.
    latency_hint_ms: 7
    cost_hint_tokens: 15
    required: [command, host]
    optional: []

  - name: summarize_incident
    description: >
      Produce a 3–4 sentence triage summary for the given alert with recommended
      actions. Incorporates the evidence strings passed in the request.
    latency_hint_ms: 6
    cost_hint_tokens: 20
    required: [alert_id]
    optional: [evidence]    # array of strings, default []

  - name: create_incident
    description: >
      Create or update an incident record in memory://incidents/{id}.
      Returns the stored incident payload.
    latency_hint_ms: 4
    cost_hint_tokens: 5
    required: [id, title]
    optional: [severity]    # low | medium | high | critical

  - name: add_evidence
    description: >
      Append an evidence item to the memory store for later correlation
      and summarization.
    latency_hint_ms: 3
    cost_hint_tokens: 5
    required: [content]
    optional: [id, source]  # source: diagnostic | runbook | manual

  - name: append_delta
    description: >
      Append a structured action delta to memory://deltas/recent for
      OPAL Learn-phase replay.
    latency_hint_ms: 2
    cost_hint_tokens: 3
    required: [action]
    optional: [details]     # arbitrary key-value object

  - name: write_plan
    description: >
      Store the current OPAL plan in memory://plans/current for inspection
      during the MCP server process lifetime.
    latency_hint_ms: 1
    cost_hint_tokens: 3
    required: [plan]        # ordered array of OPAL step descriptors
    optional: []

  - name: append_memory_delta
    description: >
      Append a structured memory delta capturing loop outcome to
      memory://deltas/recent.
    latency_hint_ms: 2
    cost_hint_tokens: 3
    required: [delta]       # arbitrary object
    optional: []

# ---------------------------------------------------------------------------
# Resource registry (memory:// URIs)
# ---------------------------------------------------------------------------
resources:
  - uri: "memory://incidents/{id}"
    description: Incident record (id, title, severity)

  - uri: "memory://evidence/{id}"
    description: Evidence item (id, content, source)

  - uri: "memory://deltas/recent"
    description: Ordered list of OPAL action deltas (items array); each has alert_id, ISO timestamp and key alert_id@timestamp

  - uri: "memory://plans/current"
    description: Current persisted OPAL plan (plan array)

  - uri: "memory://alerts/latest"
    description: Most recent alert payload (id, service, symptom, severity)

  - uri: "memory://runbooks/index"
    description: Array of runbook objects available for retrieval

  - uri: "memory://telemetry/snapshot"
    description: Deterministic summary of telemetry recorded by the server (total_events, by_phase, by_loop, last_events)

  - uri: "memory://memory/deltas"
    description: Alias delta store used by server resource fixtures (items array)
